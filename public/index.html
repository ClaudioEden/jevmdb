<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JevMDB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra fixa no topo com o uso do Jev; card de busca em cima (abas exclusivas) que recolhe depois da busca;
   resultados embaixo em cartões com pôster. Paleta índigo escura com verde para as notas. */
:root{
  --bg:#f5f5fb; --surface:#ffffff; --surface-2:#eef0fa; --line:#dfe1f0; --fg:#14142b; --muted:#5b5b7a;
  --primary:#4338ca; --primary-fg:#ffffff; --primary-soft:#e5e6fb; --ok:#15803d; --ok-soft:#dcf5e5; --bar:#e4e5f2;
  --danger:#b91c1c; --shadow:0 1px 2px rgba(20,20,43,.06),0 8px 24px rgba(20,20,43,.06);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0f23; --surface:#17172e; --surface-2:#1f1f3c; --line:#2c2c4d; --fg:#f8fafc; --muted:#a3a3c2;
  --primary:#818cf8; --primary-fg:#0f0f23; --primary-soft:#272758; --ok:#4ade80; --ok-soft:#173a29; --bar:#2a2a48;
  --danger:#f87171; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0f23; --surface:#17172e; --surface-2:#1f1f3c; --line:#2c2c4d; --fg:#f8fafc; --muted:#a3a3c2;
  --primary:#818cf8; --primary-fg:#0f0f23; --primary-soft:#272758; --ok:#4ade80; --ok-soft:#173a29; --bar:#2a2a48;
  --danger:#f87171; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Barra superior com o uso */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;letter-spacing:-.01em;margin-right:auto}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),#a855f7);color:#fff}
.badge{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.badge.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.uso{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:flex;flex-direction:column;padding:4px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:84px}
.stat span{font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat b{font-size:.92rem;font-weight:600}
.stat.total{background:var(--primary-soft);border-color:transparent}

.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 64px}
.hero{margin:4px 0 18px}
.hero h1{font-size:clamp(1.6rem,3.6vw,2.3rem);line-height:1.15;letter-spacing:-.025em;margin:0 0 6px;font-weight:800}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--primary),#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);max-width:62ch}

/* Card de busca */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.search{padding:8px 20px 20px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px;width:max-content;max-width:100%;margin:12px 0 18px}
.tab{display:flex;align-items:center;gap:8px;font:600 .92rem var(--font);color:var(--muted);background:none;border:0;padding:9px 16px;border-radius:9px;cursor:pointer;min-height:40px;transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:var(--primary);color:var(--primary-fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tab:not([aria-selected="true"]):hover{color:var(--fg)}
.lbl{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin:0 0 8px;letter-spacing:.01em}
.field{margin-bottom:18px;position:relative}
.input{display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);transition:border-color .2s,box-shadow .2s}
.input:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.input svg{color:var(--muted)}
.input input{flex:1;min-width:0;font:inherit;padding:12px 0;border:0;background:none;color:var(--fg);outline:none}
textarea{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);min-height:120px;resize:vertical;outline:none;transition:border-color .2s,box-shadow .2s}
textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.hint{font-size:.84rem;color:var(--muted);margin:8px 0 0}
.sugs{list-style:none;margin:8px 0 0;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);display:grid;gap:2px;max-height:380px;overflow:auto}
.sugs:empty{display:none}
.sug{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;padding:6px 8px;border-radius:9px;cursor:pointer;min-height:56px}
.sug:hover,.sug:focus-visible{background:var(--surface-2);outline:none}
.sug b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug small{color:var(--muted);font-size:.8rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb{width:40px;height:60px;border-radius:6px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:.8rem;overflow:hidden}
.pill{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.pill.ext{background:var(--primary-soft);color:var(--primary)}
.chosen{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px;border:1px solid var(--primary);border-radius:12px;background:var(--primary-soft)}
.chosen .thumb{width:48px;height:72px}
.chosen b{display:block;font-weight:700}
.chosen small{color:var(--muted)}
.link{font:600 .86rem var(--font);color:var(--primary);background:none;border:0;cursor:pointer;padding:8px;border-radius:8px;min-height:40px}
.link:hover{background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;min-height:40px;border:1px solid var(--line);border-radius:999px;font-size:.92rem;font-weight:500;cursor:pointer;user-select:none;background:var(--bg);transition:background .2s,border-color .2s,color .2s}
.chip input:checked+span{background:var(--primary);border-color:var(--primary);color:var(--primary-fg);font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px}
.tags .chip span{font-size:.82rem;padding:5px 12px;min-height:34px}
.tags .chip input:checked+span{background:var(--primary-soft);color:var(--fg);border-color:var(--primary)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 1rem var(--font);padding:12px 22px;min-height:48px;border:0;border-radius:12px;background:var(--primary);color:var(--primary-fg);cursor:pointer;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* Estado recolhido */
.resumo{display:none;align-items:flex-start;gap:16px;padding:16px 20px}
.search-card.recolhido .search{display:none}
.search-card.recolhido .resumo{display:flex}
.resumo .thumb{width:40px;height:60px}
.resumo .txt{flex:1;min-width:0}
.resumo b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resumo small{color:var(--muted)}
.resumo .r-cabeca{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.resumo.com-ficha .thumb{width:96px;height:144px;border-radius:10px}
.resumo.com-ficha #r-tit{white-space:normal;font-size:1.15rem;line-height:1.25}
.r-ref{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.r-det{margin-top:8px}
.r-det .orig{color:var(--muted);font-size:.86rem}
.r-det .elenco{font-size:.86rem;margin-top:4px}
.r-det .elenco span{color:var(--muted)}
.r-det .syn{display:block;-webkit-line-clamp:unset;margin:8px 0 6px}
/* Card da referência semi-recolhido: na altura do pôster, com o texto sumindo num fade */
.r-corpo{position:relative}
.resumo.com-ficha .r-corpo{max-height:144px;overflow:hidden}
.resumo.com-ficha .r-corpo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(to bottom,transparent,var(--surface));pointer-events:none}
.resumo.com-ficha .r-corpo.aberto{max-height:none}
.resumo.com-ficha .r-corpo.aberto::after,.resumo.com-ficha .r-corpo.cabe::after{display:none}
.r-abrir{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font:600 .84rem var(--font);color:var(--primary);background:none;border:0;padding:6px 0;cursor:pointer;min-height:36px}
.r-abrir svg{width:16px;height:16px;transition:transform .2s}
.r-abrir[aria-expanded="true"] svg{transform:rotate(180deg)}
@media (max-width:640px){.resumo.com-ficha .r-corpo{max-height:108px}}
/* "Sentiu falta de algum filme?" */
.falta{margin:18px 0 0;padding:16px 18px}
.falta p{margin:0 0 10px;font-weight:600}
.falta form{display:flex;flex-wrap:wrap;gap:8px}
.falta input{flex:1;min-width:200px;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);outline:none}
.falta input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.falta .btn{min-height:42px;padding:8px 18px}
@media (max-width:640px){.resumo{flex-wrap:wrap}.resumo.com-ficha .thumb{width:72px;height:108px}#nova{width:100%}}

/* Resultados */
.res-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px;margin:28px 0 14px}
.res-head h2{font-size:1.3rem;letter-spacing:-.015em;margin:0;font-weight:700}
.res-head span{color:var(--muted);font-size:.88rem}
.msg{padding:28px 20px;text-align:center;color:var(--muted)}
.msg.err{color:var(--danger);text-align:left}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.filme{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:18px;padding:16px;align-items:start}
.poster{width:110px;aspect-ratio:2/3;border-radius:10px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:1.4rem;overflow:hidden}
.filme h3{margin:0;font-size:1.12rem;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.filme .orig{color:var(--muted);font-size:.86rem;margin-top:2px}
.rank{font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.nota{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--v)*1%),var(--bar) 0)}
.nota div{width:58px;height:58px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1}
.nota b{font-size:1.3rem;font-weight:800}
.nota small{display:block;font-size:.58rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.crits{display:grid;gap:6px;margin:12px 0 4px;max-width:420px}
.crit{display:grid;grid-template-columns:64px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:.8rem;color:var(--muted)}
.crit b{text-align:right;color:var(--fg);font-weight:600}
.meter{height:6px;background:var(--bar);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--ok))}
.tagsl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.tagsl span{font-size:.74rem;font-weight:500;background:var(--surface-2);color:var(--muted);padding:3px 9px;border-radius:999px}
.syn{font-size:.92rem;margin:6px 0 8px;color:var(--fg);opacity:.9;max-width:70ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fontes{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted)}
.fontes a{color:var(--primary);text-decoration:none;font-weight:500}
.fontes a:hover{text-decoration:underline}
.nota-lbl{font-size:.74rem;color:var(--muted);text-align:center;margin-top:6px;font-weight:600}
.lado{display:flex;flex-direction:column;align-items:center}
.onde{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:10px;font-size:.8rem;color:var(--muted)}
.onde>b{font-weight:600;color:var(--fg)}
.prov{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border-radius:999px;background:var(--surface-2);color:var(--fg);font-weight:500;text-decoration:none}
.prov img{width:20px;height:20px;border-radius:5px}
.prov small{color:var(--muted);font-size:.7rem}
.credito{font-size:.74rem;color:var(--muted);margin:12px 0 0;text-align:right}
.alts{display:grid;gap:2px;margin:8px 0 0;padding:0;list-style:none}
.alts .sug{min-height:48px}
.alts .thumb{width:32px;height:48px}
.sub-lbl{font-size:.8rem;color:var(--muted);margin:14px 0 6px}
/* Idiomas: bolinhas com as bandeiras dos outros dois idiomas */
.langs{display:flex;gap:6px}
.lang{width:32px;height:32px;border-radius:50%;padding:0;border:2px solid var(--line);background:none;cursor:pointer;overflow:hidden;display:grid;place-items:center;transition:transform .15s,border-color .2s}
.lang:hover{transform:scale(1.08);border-color:var(--primary)}
.lang svg{width:100%;height:100%;display:block}
/* Avaliação da busca */
.nota-busca{margin:18px 0 0;padding:14px 18px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.av-linha{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px}
.av-fim{font-size:.82rem;color:var(--muted);font-weight:600}
.estrelas{display:flex;gap:2px}
.estrela{background:none;border:0;padding:4px;cursor:pointer;color:var(--bar);min-width:32px;min-height:36px;display:grid;place-items:center}
.estrela svg{width:22px;height:22px;fill:currentColor;stroke:none}
.estrela.on{color:#fbbf24}
.estrela:focus-visible{outline:2px solid var(--primary);border-radius:6px}
#av-coment input{flex:1;min-width:200px;max-width:520px;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);outline:none}
#av-coment input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
#av-coment .btn{min-height:42px;padding:8px 18px}
#av-ok{text-align:center;margin:0}
@media (max-width:640px){.estrela{min-width:28px;padding:2px}.estrela svg{width:20px;height:20px}
  /* Celular: marca e bandeiras na primeira linha, o selo do modo vai para baixo da marca */
  .top-in{display:grid;grid-template-columns:1fr auto;align-items:center}
  .brand{flex-wrap:wrap;row-gap:2px;margin-right:0}
  .brand .cota{font-size:.7rem;padding:3px 9px}
  .langs{grid-column:2;grid-row:1}
  .uso{grid-column:1/-1}}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;margin-right:6px;vertical-align:-1px;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.novo{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);margin-left:6px;vertical-align:middle}
.skel{height:180px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;border:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){
  .skel{animation:sh 1.2s ease-in-out infinite}
  .meter i{transition:width .4s ease}
  .lista>li{animation:up .3s ease both}
}
@keyframes sh{to{background-position:-200% 0}}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@media (max-width:640px){
  .filme{grid-template-columns:78px minmax(0,1fr);gap:14px}
  .poster{width:78px}
  .lado{grid-column:2;grid-row:1;justify-self:end}
  .nota{width:58px;height:58px}
  .nota div{width:46px;height:46px}
  .nota b{font-size:1.05rem}
  .filme .info{grid-column:1/-1}
  .top-in{gap:8px}
  .uso{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none;padding-bottom:2px}
  .uso::-webkit-scrollbar{display:none}
  .stat{min-width:max-content;padding:3px 10px}
  .tabs{width:100%}
  .tab{flex:1;justify-content:center;padding:9px 10px}
  .tab .longo{display:none}
}
/* Saldo de buscas grátis, aviso de boas-vindas e tela de limite */
.cota{font-size:.78rem;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--primary-soft);color:var(--primary);border:0;cursor:pointer;font-family:var(--font)}
.cota.zero{background:#fde2e2;color:var(--danger)}
dialog#pop{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--fg);padding:26px;max-width:min(440px,calc(100vw - 32px));box-shadow:0 24px 64px rgba(0,0,0,.35)}
dialog#pop::backdrop{background:rgba(10,10,30,.6);backdrop-filter:blur(3px)}
dialog#pop h2{margin:0 0 10px;font-size:1.3rem;letter-spacing:-.02em}
dialog#pop p{margin:0 0 10px;color:var(--muted)}
dialog#pop p b{color:var(--fg)}
dialog#pop .btn{width:100%;margin-top:8px}
.btn.wa{background:#25d366;color:#06310f;text-decoration:none}
.btn.wa:hover{filter:brightness(1.05)}
dialog#lim{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--fg);padding:26px;max-width:min(460px,calc(100vw - 32px));box-shadow:0 24px 64px rgba(0,0,0,.35)}
dialog#lim::backdrop{background:rgba(10,10,30,.6);backdrop-filter:blur(3px)}
dialog#lim h2{margin:0 0 8px;font-size:1.3rem;letter-spacing:-.02em}
dialog#lim p{margin:0 0 10px;color:var(--muted)}
dialog#lim ol{margin:0 0 14px;padding-left:22px;color:var(--fg)}dialog#lim li{margin:4px 0}
dialog#lim .cod,.limite .cod{display:block;text-align:center;font:700 1.6rem/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;padding:12px 18px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line);margin:6px 0 14px;user-select:all}
dialog#lim .btn{width:100%;margin-top:8px}
dialog#lim .acoes{display:grid;gap:8px}
.aviso-cota{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;margin-bottom:12px;border-color:var(--primary)}
.aviso-cota span{flex:1 1 220px}
.aviso-cota .btn{min-height:40px;padding:8px 16px}
.limite{padding:24px;text-align:center}
.limite h3{margin:0 0 8px;font-size:1.2rem}
.limite p{margin:0 0 12px;color:var(--muted)}
.limite .cod{display:inline-block;font:700 1.6rem/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;padding:12px 18px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line);margin:4px 0 14px;user-select:all}
.limite .btn{text-decoration:none}
</style></head><body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.5"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/></svg></span>JevMDB <button type="button" class="cota" id="cota" hidden></button></div>
    <div class="uso" aria-live="polite" data-i18n-aria="uso_aria">
      <div class="stat"><span data-i18n="uso_custo"></span><b class="num" id="u-custo">—</b></div>
      <div class="stat"><span>Tokens</span><b class="num" id="u-tokens">—</b></div>
      <div class="stat"><span data-i18n="uso_chamadas"></span><b class="num" id="u-cham">—</b></div>
      <div class="stat"><span data-i18n="uso_tempo"></span><b class="num" id="u-tempo">—</b></div>
      <div class="stat total"><span data-i18n="uso_total"></span><b class="num" id="u-total">—</b></div>
    </div>
    <nav class="langs" id="langs" data-i18n-aria="idioma_aria"></nav>
  </div>
</header>

<dialog id="pop" aria-labelledby="pop-t">
  <h2 id="pop-t"></h2>
  <p id="pop-p1"></p>
  <p id="pop-p2"></p>
  <button type="button" class="btn" id="pop-ok"></button>
</dialog>

<dialog id="lim" aria-labelledby="lim-t">
  <h2 id="lim-t"></h2>
  <p id="lim-intro"></p>
  <p id="lim-ip" hidden></p>
  <ol id="lim-passos"></ol>
  <p id="lim-cod-lbl" style="margin-bottom:0"></p>
  <span class="cod" id="lim-cod"></span>
  <div class="acoes">
    <a class="btn wa" id="lim-wa" target="_blank" rel="noopener"></a>
    <p id="lim-sem" hidden></p>
    <button type="button" class="btn ghost" id="lim-copiar"></button>
    <button type="button" class="btn ghost" id="lim-fechar"></button>
  </div>
</dialog>

<main class="wrap">
  <div class="hero">
    <h1 data-i18n-html="hero_h1"></h1>
    <p data-i18n="hero_p"></p>
  </div>

  <section class="card search-card" id="busca">
    <div class="resumo">
      <span class="thumb" id="r-thumb"></span>
      <div class="txt"><div class="r-corpo" id="r-corpo"><div class="r-ref" id="r-ref" hidden data-i18n="ref_lbl"></div><b id="r-tit"></b><small id="r-sub"></small><div class="r-det" id="r-det" hidden></div></div>
        <button type="button" class="r-abrir" id="r-abrir" hidden aria-expanded="false" aria-controls="r-corpo"><span></span><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button></div>
      <button class="btn ghost" id="nova" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span data-i18n="nova"></span></button>
    </div>
    <form class="search" id="f" autocomplete="off">
      <div class="tabs" role="tablist" data-i18n-aria="tabs_aria">
        <button class="tab" role="tab" type="button" id="tab-filme" aria-selected="true" aria-controls="p-filme"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span data-i18n="tab_filme"></span><span class="longo" data-i18n="tab_filme_longo"></span></button>
        <button class="tab" role="tab" type="button" id="tab-texto" aria-selected="false" aria-controls="p-texto" tabindex="-1"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-i18n="tab_texto"></span><span class="longo" data-i18n="tab_texto_longo"></span></button>
      </div>

      <div role="tabpanel" id="p-filme" aria-labelledby="tab-filme">
        <div class="field">
          <label class="lbl" for="q" data-i18n="ref_lbl"></label>
          <div id="escolha" hidden></div>
          <div id="caixa">
            <div class="input"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input type="text" id="q" data-i18n-ph="q_ph" role="combobox" aria-expanded="false" aria-controls="sugs" aria-autocomplete="list"></div>
            <ul class="sugs" id="sugs" role="listbox" data-i18n-aria="sugs_aria"></ul>
            <p class="hint" id="q-hint" data-i18n="q_hint"></p>
          </div>
        </div>
        <div class="field">
          <span class="lbl" id="crit-lbl" data-i18n="crit_lbl"></span>
          <div class="chips" id="crit" role="group" aria-labelledby="crit-lbl"></div>
          <p class="hint" data-i18n="crit_hint"></p>
        </div>
        <div class="field" id="tagbox" hidden>
          <span class="lbl" id="tags-lbl" data-i18n="tags_lbl"></span>
          <div class="chips tags" id="tags" role="group" aria-labelledby="tags-lbl"></div>
        </div>
      </div>

      <div role="tabpanel" id="p-texto" aria-labelledby="tab-texto" hidden>
        <div class="field">
          <label class="lbl" for="pedido" data-i18n="pedido_lbl"></label>
          <textarea id="pedido" data-i18n-ph="pedido_ph"></textarea>
          <p class="hint" id="t-hint" data-i18n="t_hint"></p>
        </div>
        <div id="t-mais" class="field" hidden>
          <label class="lbl" for="extra" data-i18n="mais_lbl"></label>
          <textarea id="extra" style="min-height:80px" data-i18n-ph="extra_ph"></textarea>
          <div class="actions"><button class="btn" type="button" id="t-retentar" data-i18n="retentar"></button></div>
        </div>
        <div id="t-confirma" class="field" hidden></div>
      </div>

      <div class="actions">
        <button class="btn" id="go" type="submit"><svg class="i" viewBox="0 0 24 24"><path d="m12 3 1.9 5.8H20l-4.9 3.6 1.9 5.8-5-3.6-5 3.6 1.9-5.8L4 8.8h6.1z"/></svg><span id="go-txt"></span></button>
      </div>
    </form>
  </section>

  <section class="nota-busca" id="avaliar" hidden aria-live="polite">
    <div id="av-estrelas" class="av-linha">
      <span class="av-fim" data-i18n="av_ruim"></span>
      <div class="estrelas" id="estrelas" role="radiogroup" data-i18n-aria="av_aria"></div>
      <span class="av-fim" data-i18n="av_otimo"></span>
    </div>
    <form id="av-coment" class="av-linha" hidden>
      <input type="text" id="av-texto" maxlength="1000" data-i18n-ph="av_ph">
      <button class="btn" type="submit" data-i18n="av_enviar"></button>
    </form>
    <p id="av-ok" class="hint" hidden data-i18n="av_obrigado"></p>
  </section>

  <section aria-live="polite">
    <div class="card aviso-cota" id="cota-aviso" hidden></div>
    <div class="res-head" id="res-head" hidden><h2 data-i18n="sugestoes"></h2><span id="count"></span></div>
    <div id="out"></div>
  </section>
</main>

// Identificador do navegador para a trava da consulta grátis: junta características estáveis e um desenho em canvas.
async function fingerprint() {
  try {
    const c = document.createElement("canvas"); c.width = 220; c.height = 40;
    const g = c.getContext("2d"); g.textBaseline = "top"; g.font = "16px Arial"; g.fillStyle = "#f60"; g.fillRect(0, 0, 60, 20);
    g.fillStyle = "#069"; g.fillText("Jev ✓ filmes 1995", 2, 2);
    let gl = ""; try { const w = document.createElement("canvas").getContext("webgl"); const d = w.getExtension("WEBGL_debug_renderer_info"); gl = d ? w.getParameter(d.UNMASKED_RENDERER_WEBGL) : ""; } catch {}
    const partes = [navigator.userAgent, navigator.language, navigator.platform, screen.width + "x" + screen.height, screen.colorDepth,
      Intl.DateTimeFormat().resolvedOptions().timeZone, navigator.hardwareConcurrency, navigator.deviceMemory, gl, c.toDataURL()].join("|");
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(partes));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  } catch { return ""; }
}

    ESCOLHIDO = {id: x.id, imdb: x.imdb, titulo: x.titulo, titulo_original: x.titulo_original, ano: x.ano, atores: (x.elenco || []).slice(0, 2), poster: x.poster || f.poster, no_catalogo: true};
    if (!CAT.some(c => c.id === x.id)) CAT.push({id: x.id, titulo_br: x.titulo, titulo_original: x.titulo_original, ano: x.ano, estilo: x.estilo_pt || [], estilo_tr: x.estilo || []});
    mostrarEscolhido(ESCOLHIDO, d.importado ? T("baixada") : T("ja_catalogo"));
  } catch (err) {
    if (vez !== BAIXANDO) return;
    ESCOLHIDO = null;
    mostrarEscolhido(f, `<span style="color:var(--danger)">${esc(err.message || T("erro_baixar"))}</span>`);
  }
  atualizarTags(); validar();
}

function atualizarTags() {
  const f = ESCOLHIDO?.id && CAT.find(x => x.id === ESCOLHIDO.id);
  $("#tagbox").hidden = !(f && f.estilo?.length && $("#c-estilo")?.checked);
  if (!f || $("#tags").dataset.id === f.id) return;
  $("#tags").dataset.id = f.id;
  $("#tags").innerHTML = f.estilo.map((t, i) => `<label class="chip"><input type="checkbox" value="${esc(t)}" checked><span>${esc(f.estilo_tr?.[i] || t)}</span></label>`).join("");
}
$("#crit").addEventListener("change", () => { atualizarTags(); validar(); });
$("#pedido").addEventListener("input", () => { TX = {cand: null, alts: [], rejeitados: [], criterios: []}; $("#t-confirma").hidden = true; $("#t-mais").hidden = true; validar(); });
function criteriosMarcados() { return [...document.querySelectorAll("#crit input:checked")].map(i => i.value); }
function validar() {
  const texto = ABA === "texto";
  $("#go-txt").textContent = texto ? T("go_identificar") : T("go_buscar");
  $("#go").hidden = texto && (!!TX.cand || !$("#t-mais").hidden);
  $("#go").disabled = texto ? $("#pedido").value.trim().length < 5 : !(ESCOLHIDO && !ESCOLHIDO.baixando && criteriosMarcados().length);
}
validar();

// ---------- Recolher / Nova pesquisa ----------
function recolher(titulo, sub, poster, ref) {
  $("#r-thumb").outerHTML = capa(poster, titulo, "thumb").replace(/class="thumb"/, 'class="thumb" id="r-thumb"');
  $("#r-tit").textContent = titulo; $("#r-sub").textContent = sub;
  $("#busca").classList.add("recolhido");
  // Com a ficha da referência: mostra os dados do filme, para a pessoa conferir se a comparação faz sentido.
  $(".resumo").classList.toggle("com-ficha", !!ref);
  $("#r-ref").hidden = !ref; $("#r-det").hidden = !ref;
  if (!ref) { $("#r-det").innerHTML = ""; $("#r-abrir").hidden = true; $("#r-corpo").classList.remove("aberto", "cabe"); return; }
  const fontes = (ref.fontes || [{nome: T("fonte"), url: ref.fonte}]).concat(ref.imdb && !(ref.fontes || []).some(x => x.nome === "IMDb") ? [{nome: "IMDb", url: `https://www.imdb.com/title/${ref.imdb}/`}] : []);
  $("#r-det").innerHTML = `
    <div class="orig">${esc(ref.titulo_original)} · ${ref.ano || ""}${ref.diretor ? " · " + esc(ref.diretor) : ""}${ref.nota_imdb ? ` · IMDb ${nf(ref.nota_imdb, 1)}` : ""}${ref.nota_tmdb ? ` · TMDB ${nf(ref.nota_tmdb, 1)}` : ""}</div>
    ${ref.elenco?.length ? `<div class="elenco"><span>${T("elenco")}:</span> ${esc(ref.elenco.slice(0, 4).join(", "))}</div>` : ""}
    <div class="tagsl">${[...(ref.generos || []).slice(0, 3), ...(ref.estilo || []).slice(0, 5)].filter((t, i, a) => a.findIndex(x => x.toLowerCase() === t.toLowerCase()) === i).map(t => `<span>${esc(t)}</span>`).join("")}</div>
    ${ref.sinopse ? `<p class="syn">${esc(ref.sinopse)}</p>` : ""}
    <div class="fontes" style="margin-top:6px">${fontes.filter(x => x.url).map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.nome)}</a>`).join("")}</div>
    <div class="onde" data-id="${esc(ref.id)}"><b>${T("onde_lbl")}</b> <span>${T("procurando")}</span></div>`;
  // Semi-recolhido: mostra até a altura do pôster; o botão abre a ficha completa.
  const corpo = $("#r-corpo"), botao = $("#r-abrir");
  const marcar = aberto => { corpo.classList.toggle("aberto", aberto); botao.setAttribute("aria-expanded", aberto); botao.querySelector("span").textContent = aberto ? T("ficha_fechar") : T("ficha_abrir"); };
  marcar(false);
  requestAnimationFrame(() => { const cabe = corpo.scrollHeight <= corpo.clientHeight + 2; corpo.classList.toggle("cabe", cabe); botao.hidden = cabe; });
  botao.onclick = () => marcar(!corpo.classList.contains("aberto"));
}
$("#nova").onclick = () => {
  $("#busca").classList.remove("recolhido");
  (ABA === "filme" ? (ESCOLHIDO ? $("#trocar") : $("#q")) : $("#pedido")).focus();
  window.scrollTo({top: 0, behavior: "smooth"});
};

// ---------- Onde assistir (carrega depois dos resultados) ----------
async function carregarOnde(ids) {
  let dados = {};
  try { dados = await (await api("/api/onde-assistir?ids=" + ids.map(encodeURIComponent).join(","))).json(); } catch {}
  document.querySelectorAll(".onde[data-id]").forEach(el => {
    const o = dados[el.dataset.id], span = el.querySelector("span");
    if (!o) { span.textContent = T("sem_info"); return; }
    if (!o.plataformas.length) { span.textContent = T("sem_streaming", {p: T("pais." + REGIAO[LANG])}); return; }
    span.outerHTML = o.plataformas.slice(0, 6).map(p => `<span class="prov">${p.logo ? `<img src="${esc(p.logo)}" alt="" loading="lazy">` : ""}${esc(p.nome)} <small>${esc(T("oferta." + p.tipo))}</small></span>`).join("");
  });
}

// ---------- Aba de texto: identificar, confirmar, ou pedir mais detalhes ----------
async function identificar() {
  const pedido = [$("#pedido").value, $("#extra").value].map(s => s.trim()).filter(Boolean).join("\n");
  $("#go").disabled = true; $("#t-retentar").disabled = true;
  $("#t-confirma").hidden = false; $("#t-confirma").innerHTML = `<p class="hint">${T("identificando")}</p>`;
  limparUso();
  try {
    const r = await api("/api/identificar", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({pedido, rejeitados: TX.rejeitados})});
    const d = await r.json();
    mostrarUso(d.uso, d.uso_total);
    if (r.status === 402 || r.status === 503) { $("#t-confirma").hidden = true; $("#out").innerHTML = ""; $("#res-head").hidden = false; mostrarLimite(d); return; }
    if (!r.ok) throw new Error(erroTxt(d));
    TX.cand = d.candidato; TX.alts = d.alternativas || []; TX.criterios = d.criterios || ["estilo"];
    if (!TX.cand) { $("#t-confirma").hidden = true; pedirMais(T("nao_identifiquei")); return; }
    $("#t-mais").hidden = true;
    mostrarConfirmacao();
  } catch (err) {
    $("#t-confirma").innerHTML = `<p class="hint" style="color:var(--danger)">${esc(err.message)}</p>`;
  } finally { $("#t-retentar").disabled = false; validar(); }
}
function pedirMais(msg) {
  TX.cand = null; $("#t-mais").hidden = false;
  $("#t-mais .lbl").textContent = msg || T("mais_lbl");
  $("#extra").focus(); validar();
}
function mostrarConfirmacao() {
  const c = TX.cand;
  $("#t-confirma").innerHTML = `<span class="lbl">${T("e_este")}</span>
    <div class="chosen">${capa(c.poster, c.titulo, "thumb")}
      <div><b>${esc(c.titulo)}</b><small>${esc(c.titulo_original && c.titulo_original !== c.titulo ? c.titulo_original + " · " : "")}${c.ano || ""}${c.atores?.length ? " · " + esc(c.atores.join(", ")) : ""}</small></div><span></span></div>
    ${TX.alts.length ? `<p class="sub-lbl">${T("ou_seria")}</p><ul class="alts">${TX.alts.map((a, i) => `<li><button type="button" class="sug" data-alt="${i}">${capa(a.poster, a.titulo, "thumb")}<span><b>${esc(a.titulo)}</b><small>${a.ano || ""}${a.atores?.length ? " · " + esc(a.atores.join(", ")) : ""}</small></span><span></span></button></li>`).join("")}</ul>` : ""}
    <p class="sub-lbl">${T("entendi_crit")}</p>
    <div class="chips" id="crit-t" role="group" aria-label="${T("crit_aria")}">${Object.entries(NOMES).map(([k, n]) => `<label class="chip"><input type="checkbox" value="${k}" ${TX.criterios.includes(k) ? "checked" : ""}><span>${esc(n)}</span></label>`).join("")}</div>
    <div class="actions" style="margin-top:16px">
      <button class="btn" type="button" id="t-sim"><svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>${T("sim_buscar")}</button>
      <button class="btn ghost" type="button" id="t-nao">${T("nao_e")}</button>
    </div>`;
  $("#t-confirma").querySelectorAll("[data-alt]").forEach(b => b.onclick = () => {
    const i = Number(b.dataset.alt); [TX.cand, TX.alts[i]] = [TX.alts[i], TX.cand]; guardarCriterios(); mostrarConfirmacao();
  });
  const critT = () => [...document.querySelectorAll("#crit-t input:checked")].map(i => i.value);
  const guardarCriterios = () => { TX.criterios = critT(); };
  $("#crit-t").addEventListener("change", () => { guardarCriterios(); $("#t-sim").disabled = !TX.criterios.length; });
  $("#t-sim").onclick = () => buscar({filme: c.id || "", imdb: c.id ? "" : c.imdb, criterios: critT()}, c.titulo, c.poster, true);
  $("#t-nao").onclick = () => {
    TX.rejeitados.push({imdb: c.imdb, id: c.id, titulo: c.titulo_original || c.titulo, ano: c.ano}, ...TX.alts.map(a => ({imdb: a.imdb, id: a.id, titulo: a.titulo_original || a.titulo, ano: a.ano})));
    $("#t-confirma").hidden = true;
    pedirMais(T("nao_e_mais"));
  };
  validar();
}
$("#t-retentar").onclick = () => { if ($("#extra").value.trim() || $("#pedido").value.trim()) identificar(); };

// ---------- Avaliação da busca (1 a 10 estrelas + comentário opcional) ----------
let BUSCA_ID = null;
const ESTRELA = `<svg viewBox="0 0 24 24"><path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>`;
function mostrarAvaliacao(id) {
  BUSCA_ID = id; if (!id) return;
  $("#avaliar").hidden = false; $("#av-estrelas").hidden = false; $("#av-coment").hidden = true; $("#av-ok").hidden = true;
  $("#estrelas").innerHTML = Array.from({length: 10}, (_, i) =>
    `<button type="button" class="estrela" role="radio" aria-checked="false" data-n="${i + 1}" aria-label="${T("av_estrela", {n: i + 1})}">${ESTRELA}</button>`).join("");
  const botoes = [...document.querySelectorAll("#estrelas .estrela")];
  const acender = n => botoes.forEach((b, i) => b.classList.toggle("on", i < n));
  botoes.forEach(b => {
    b.onmouseenter = b.onfocus = () => acender(Number(b.dataset.n));
    b.onclick = () => avaliar({estrelas: Number(b.dataset.n)}).then(() => {
      $("#av-estrelas").hidden = true; $("#av-coment").hidden = false; $("#av-texto").value = ""; $("#av-texto").focus();
    });
  });
  $("#estrelas").onmouseleave = () => acender(0);
}
async function avaliar(dados) {
  try { await api("/api/avaliar", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({busca_id: BUSCA_ID, ...dados})}); } catch {}
}
$("#av-coment").addEventListener("submit", async e => {
  e.preventDefault();
  const txt = $("#av-texto").value.trim();
  if (txt) await avaliar({comentario: txt});
  $("#av-coment").hidden = true; $("#av-ok").hidden = false;
});

// ---------- "Sentiu falta de algum filme?" (abaixo da lista) ----------
function mostrarFalta(buscaId) {
  $("#out").insertAdjacentHTML("beforeend", `<section class="card falta" id="falta">
    <p>${T("falta_titulo")}</p>
    <form id="falta-f"><input type="text" id="falta-t" maxlength="120" placeholder="${esc(T("falta_ph"))}" aria-label="${esc(T("falta_titulo"))}"><button class="btn" type="submit">${T("av_enviar")}</button></form>
  </section>`);
  $("#falta-f").addEventListener("submit", async e => {
    e.preventDefault();
    const texto = $("#falta-t").value.trim();
    if (texto.length < 2) return;
    try { await api("/api/sentiu-falta", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({texto, busca_id: buscaId})}); } catch {}
    $("#falta-f").outerHTML = `<p class="hint" style="margin:0">${T("falta_ok")}</p>`;
  });
}

// ---------- Busca de sugestões ----------
$("#f").addEventListener("submit", e => {
  e.preventDefault();
  if ($("#go").disabled) return;
  if (zerada()) return abrirLimite();
  if (ABA === "texto") return identificar();
  buscar({filme: ESCOLHIDO.id || "", imdb: ESCOLHIDO.id ? "" : ESCOLHIDO.imdb, criterios: criteriosMarcados(),
    foco: $("#tagbox").hidden ? [] : [...document.querySelectorAll("#tags input:checked")].map(i => i.value)}, ESCOLHIDO.titulo, ESCOLHIDO.poster, false);
});

async function buscar(body, titulo, poster, peloTexto) {
  recolher(titulo, T("consultando"), poster);
  $("#avaliar").hidden = true; $("#cota-aviso").hidden = true;
  $("#res-head").hidden = false; $("#count").textContent = "";
  $("#out").innerHTML = `<div class="lista">${'<div class="skel"></div>'.repeat(3)}</div>`;
  limparUso();
  $("#go").disabled = true;
  try {
    const r = await api("/api/recomendar", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const d = await r.json();
    mostrarUso(d.uso || {custo_usd: 0, input_tokens: 0, output_tokens: 0, chamadas: 0, tempo_ms: 0}, d.uso_total);
    if (r.status === 402 || r.status === 503) {
      $("#r-sub").textContent = T("lim_sub");
      mostrarLimite(d);
      return;
    }
    if (!r.ok) throw new Error(erroTxt(d));
    if (d.cota) mostrarCota(d.cota);
    avisoUltima(d.cota);
    mostrarAvaliacao(d.busca_id);
    const ref = d.referencia;
    if (d.importado) CAT.push(ref);
    if (!peloTexto && !ESCOLHIDO.id) { ESCOLHIDO = {...ESCOLHIDO, id: ref.id, no_catalogo: true}; }
    if (peloTexto && TX.cand && !TX.cand.id) TX.cand = {...TX.cand, id: ref.id, no_catalogo: true};
    recolher(`${ref.titulo_br} (${ref.ano})`, T("criterios_sub", {c: d.criterios.map(c => NOMES[c]).join(", ")}) + (d.importado ? " · " + T("catalogado_agora") : "") + (peloTexto ? " · " + T("pelo_texto") : ""), ref.poster, ref);
    $("#count").textContent = T("count", {n: d.ranking.length, t: d.candidatos_avaliados}) + (d.ampliado ? " · " + T("ampliado", {n: d.ampliado}) : "");
    const varios = d.criterios.length > 1;
    $("#out").innerHTML = d.ranking.length ? `<ol class="lista">${d.ranking.map((f, i) => `
      <li class="card filme">
        ${capa(f.poster, f.titulo_br, "poster")}
        <div class="info">
          <div class="rank">#${i + 1}</div>
          <h3>${esc(f.titulo_br)}</h3>
          <div class="orig">${esc(f.titulo_original)} · ${f.ano}${f.diretor ? " · " + esc(f.diretor) : ""}${f.nota_imdb ? ` · IMDb ${nf(f.nota_imdb, 1)}` : ""}${f.nota_tmdb ? ` · TMDB ${nf(f.nota_tmdb, 1)}` : ""}</div>
          ${varios ? `<div class="crits">${d.criterios.map(c => `<div class="crit"><span>${esc(NOMES[c])}</span><div class="meter"><i style="width:${f.notas[c]}%"></i></div><b class="num">${f.notas[c]}</b></div>`).join("")}</div>` : ""}
          <div class="tagsl">${(f.estilo || []).slice(0, 5).map(t => `<span>${esc(t)}</span>`).join("")}</div>
          <p class="syn">${esc(f.sinopse)}</p>
          <div class="fontes">${(f.fontes || [{nome: T("fonte"), url: f.fonte}]).concat(f.imdb && !(f.fontes || []).some(x => x.nome === "IMDb") ? [{nome: "IMDb", url: `https://www.imdb.com/title/${f.imdb}/`}] : [])
            .filter(x => x.url).map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.nome)}</a>`).join("")}</div>
          <div class="onde" data-id="${esc(f.id)}"><b>${T("onde_lbl")}</b> <span>${T("procurando")}</span></div>
        </div>
        <div class="lado"><div class="nota" style="--v:${f.media}" role="img" aria-label="${T("aria_sim", {v: f.media})}"><div><span><b class="num">${f.media}%</b><small>${varios ? T("media") : esc(NOMES[d.criterios[0]])}</small></span></div></div>
          <div class="nota-lbl">${T("similaridade")}</div></div>
      </li>`).join("")}</ol><p class="credito">${T("credito")}</p>` : `<div class="card msg">${T("nenhuma")}</div>`;
    mostrarFalta(d.busca_id);
    carregarOnde([ref.id, ...d.ranking.map(f => f.id)]);
  } catch (err) {
    $("#r-sub").textContent = T("nao_deu");
    $("#out").innerHTML = `<div class="card msg err">${esc(err.message)}</div>`;
  } finally { validar(); }
}
</script>
</body></html>
